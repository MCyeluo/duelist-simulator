<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>牌佬模拟器 - 开发工具 v4.3</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:#0f0f1a; --bg2:#1a1a2e; --bg3:#252540; --border:#3a3a5c;
  --text:#e8e8f0; --text2:#a0a0c0; --gold:#d4af37; --gold-light:#f0d060;
  --purple:#8b5cf6; --purple-light:#a78bfa; --red:#ef4444; --green:#22c55e;
  --blue:#3b82f6; --search:#3b82f6; --expand:#22c55e; --disrupt:#ef4444;
  --resist:#8b5cf6; --suppress:#f59e0b; --power:#ec4899; --soul:#06b6d4; --luck:#fbbf24; --proficiency:#14b8a6; --intelligence:#a855f7;
}
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

/* 顶部栏 */
.topbar { background:linear-gradient(135deg,var(--bg2),var(--bg3)); border-bottom:2px solid var(--gold); padding:10px 16px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; position:sticky; top:0; z-index:100; }
.topbar-title { font-size:16px; font-weight:bold; color:var(--gold); display:flex; align-items:center; gap:8px; }
.topbar-actions { display:flex; gap:6px; flex-wrap:wrap; }
.btn { padding:7px 14px; border:none; border-radius:6px; cursor:pointer; font-size:12px; font-weight:600; transition:all .2s; display:inline-flex; align-items:center; gap:5px; }
.btn:hover { transform:translateY(-1px); filter:brightness(1.15); }
.btn-gold { background:linear-gradient(135deg,var(--gold),#b8941f); color:#1a1a2e; }
.btn-primary { background:var(--blue); color:white; }
.btn-success { background:var(--green); color:white; }
.btn-danger { background:var(--red); color:white; }
.btn-secondary { background:var(--bg3); color:var(--text); border:1px solid var(--border); }
.btn-sm { padding:4px 8px; font-size:11px; }

/* 主体布局 */
.main { display:flex; height:calc(100vh - 52px); }
.sidebar { width:140px; min-width:120px; background:var(--bg2); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:8px 0; overflow-y:auto; }
.nav-item { padding:12px 16px; cursor:pointer; font-size:13px; color:var(--text2); border-left:3px solid transparent; transition:all .15s; display:flex; align-items:center; gap:8px; }
.nav-item:hover { background:var(--bg3); color:var(--text); }
.nav-item.active { background:rgba(212,175,55,.1); color:var(--gold); border-left-color:var(--gold); font-weight:600; }
.nav-icon { font-size:16px; }
.nav-category { padding:10px 16px 4px; font-size:10px; color:var(--text3); text-transform:uppercase; letter-spacing:1px; font-weight:600; opacity:.7; }

.content { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.content-header { padding:12px 20px; border-bottom:1px solid var(--border); background:var(--bg2); display:flex; align-items:center; justify-content:space-between; }
.content-title { font-size:15px; font-weight:bold; color:var(--gold); }
.content-body { flex:1; display:flex; overflow:hidden; }

/* 列表 */
.list-panel { width:280px; min-width:240px; border-right:1px solid var(--border); display:flex; flex-direction:column; background:var(--bg2); }
.list-filters { padding:10px; border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:6px; }
.list-filters input, .list-filters select { padding:6px 8px; background:var(--bg3); border:1px solid var(--border); border-radius:4px; color:var(--text); font-size:12px; outline:none; }
.card-type-filters { display:flex; gap:4px; padding:0 10px 8px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
.type-filter-btn { flex:1; min-width:40px; padding:5px 4px; background:var(--bg3); border:1px solid var(--border); border-radius:4px; color:var(--text2); font-size:11px; cursor:pointer; transition:all 0.2s; }
.type-filter-btn:hover { background:var(--bg-hover); color:var(--text); }
.type-filter-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.list-count { font-size:11px; color:var(--text2); text-align:center; padding:4px; }
.list-items { flex:1; overflow-y:auto; padding:6px; }
.list-item { padding:8px 10px; margin-bottom:4px; background:var(--bg3); border:1px solid var(--border); border-radius:5px; cursor:pointer; transition:all .15s; display:flex; align-items:center; gap:6px; font-size:12px; }
.list-item:hover { border-color:var(--gold); }
.list-item.active { border-color:var(--gold); background:rgba(212,175,55,.1); }
.list-item-name { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.list-item-del { color:var(--red); cursor:pointer; padding:0 4px; opacity:.6; font-size:14px; }
.list-item-del:hover { opacity:1; }
.rarity-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.rarity-dot.UR { background:linear-gradient(135deg,#ffd700,#ff8c00); }
.rarity-dot.SR { background:linear-gradient(135deg,#c0c0ff,#8080ff); }
.rarity-dot.R { background:#a0a0a0; }
.rarity-dot.N { background:#666; }

/* 编辑区 */
.edit-panel { flex:1; overflow-y:auto; padding:16px 20px; }
.edit-section { margin-bottom:20px; }
.edit-section-title { font-size:13px; font-weight:bold; color:var(--purple-light); margin-bottom:10px; padding-bottom:5px; border-bottom:1px solid var(--border); }
.form-row { display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
.form-group { flex:1; min-width:120px; display:flex; flex-direction:column; gap:3px; }
.form-group label { font-size:11px; color:var(--text2); font-weight:500; }
.form-group input, .form-group select, .form-group textarea { padding:7px 9px; background:var(--bg3); border:1px solid var(--border); border-radius:4px; color:var(--text); font-size:12px; outline:none; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:var(--gold); }
.form-group textarea { resize:vertical; min-height:50px; font-family:inherit; }

/* 属性滑块 */
.stat-group { margin-bottom:10px; }
.stat-label { display:flex; justify-content:space-between; font-size:12px; margin-bottom:3px; }
.stat-slider { -webkit-appearance:none; width:100%; height:5px; border-radius:3px; background:var(--bg3); outline:none; cursor:pointer; }
.stat-slider::-webkit-slider-thumb { -webkit-appearance:none; width:16px; height:16px; border-radius:50%; cursor:pointer; border:2px solid white; }
.stat-slider.search::-webkit-slider-thumb { background:var(--search); }
.stat-slider.expand::-webkit-slider-thumb { background:var(--expand); }
.stat-slider.disrupt::-webkit-slider-thumb { background:var(--disrupt); }
.stat-slider.resist::-webkit-slider-thumb { background:var(--resist); }
.stat-slider.suppress::-webkit-slider-thumb { background:var(--suppress); }
.stat-slider.power::-webkit-slider-thumb { background:var(--power); }
.stat-slider.soul::-webkit-slider-thumb { background:var(--soul); }
.stat-slider.luck::-webkit-slider-thumb { background:var(--luck); }

/* 效果/选项列表 */
.dyn-list { display:flex; flex-direction:column; gap:6px; margin-bottom:8px; }
.dyn-item { background:var(--bg3); border:1px solid var(--border); border-radius:5px; padding:8px 10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.dyn-item select, .dyn-item input { padding:5px 7px; background:var(--bg); border:1px solid var(--border); border-radius:3px; color:var(--text); font-size:11px; outline:none; }
.dyn-del { color:var(--red); cursor:pointer; padding:0 4px; font-size:14px; opacity:.6; }
.dyn-del:hover { opacity:1; }
.add-btn { padding:5px 12px; background:var(--bg3); border:1px dashed var(--border); border-radius:4px; color:var(--text2); cursor:pointer; font-size:11px; width:100%; }
.add-btn:hover { border-color:var(--gold); color:var(--gold); }

/* 空状态 */
.empty { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:var(--text2); gap:10px; }
.empty-icon { font-size:40px; opacity:.5; }

/* Toast */
.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--bg3); border:1px solid var(--gold); color:var(--text); padding:8px 16px; border-radius:6px; font-size:12px; z-index:1000; animation:toastIn .3s ease; }
@keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(10px);} to{opacity:1;transform:translateX(-50%) translateY(0);} }

/* 滚动条 */
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:var(--bg); }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

/* 响应式 */
@media (max-width:900px) {
  .main { flex-direction:column; height:auto; }
  .sidebar { width:100%; flex-direction:row; overflow-x:auto; padding:4px; }
  .nav-item { padding:8px 12px; border-left:none; border-bottom:3px solid transparent; white-space:nowrap; }
  .nav-item.active { border-bottom-color:var(--gold); border-left-color:transparent; }
  .content { min-height:70vh; }
  .content-body { flex-direction:column; }
  .list-panel { width:100%; max-height:35vh; border-right:none; border-bottom:1px solid var(--border); }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">⚔️ 牌佬模拟器 - 开发工具 <span style="font-size:11px;color:var(--text2);font-weight:normal;">v4.3 精灵战争适配版</span></div>
  <div class="topbar-actions">
    <input type="file" id="load-card" accept=".js" style="display:none" onchange="loadFile(event,'card')">
    <input type="file" id="load-game" accept=".js" style="display:none" onchange="loadFile(event,'game')">
    <input type="file" id="load-html" accept=".html" style="display:none" onchange="loadGameFile(event)">
    <button class="btn btn-secondary btn-sm" onclick="document.getElementById('load-card').click()">📂 卡片数据</button>
    <button class="btn btn-secondary btn-sm" onclick="document.getElementById('load-game').click()">📂 游戏数据</button>
    <button class="btn btn-secondary btn-sm" onclick="document.getElementById('load-html').click()">🎮 导入游戏本体</button>
    <button class="btn btn-gold btn-sm" onclick="saveAll()">💾 保存数据文件</button>
    <button class="btn btn-gold btn-sm" onclick="exportGameFile()" id="export-btn" style="display:none">🚀 导出游戏本体</button>
  </div>
</div>

<div class="main">
  <div class="sidebar" id="sidebar"></div>
  <div class="content">
    <div class="content-header">
      <div class="content-title" id="content-title">选择数据类型</div>
      <div id="content-actions"></div>
    </div>
    <div class="content-body" id="content-body">
      <div class="empty"><div class="empty-icon">📋</div><div>从左侧选择要编辑的数据类型</div></div>
    </div>
  </div>
</div>

<script>
// ===== 数据存储 =====
let cardDB = {};
let gameData = { talents:[], opponents:[], duelConfig:{}, gameConfig:{}, locations:[], characters:[], tournaments:[], achievements:[], tasks:[], events:{}, redeemCodes:[], cardBoxes:[] };
let currentType = null;
let currentId = null;
let cardFilterType = 'all'; // 卡片类型筛选：all/monster/spell/trap/extra
let cardRarityFilter = 'all'; // 卡片稀有度筛选：all/N/R/SR/UR
let talentFilter = 'all'; // 天赋品质筛选：all/N/R/SR/UR/hidden
let opponentFilter = 'all'; // 对手类型筛选：all/normal/event/tournament/story/special/自定义类型
let tournamentFilter = 'all'; // 比赛级别筛选：all/入门/中级/高级/官方
let characterFilter = 'all'; // 角色筛选：all/challenge/gift
let originalGameFile = null; // 保存原始游戏本体文件内容，用于导出

const TYPES = [
  { id:'card', name:'卡片', icon:'🎴', category:'核心数据' },
  { id:'talent', name:'天赋', icon:'⭐', category:'核心数据' },
  { id:'achievement', name:'成就', icon:'🏆', category:'核心数据' },
  { id:'task', name:'任务', icon:'📋', category:'核心数据' },
  { id:'cardBox', name:'卡盒', icon:'📦', category:'核心数据' },
  { id:'gameConfig', name:'核心配置', icon:'🔧', category:'核心数据' },
  { id:'redeemCode', name:'兑换码', icon:'🎁', category:'核心数据' },
  { id:'opponent', name:'对手', icon:'⚔️', category:'决斗系统' },
  { id:'duelConfig', name:'决斗配置', icon:'⚙️', category:'决斗系统' },
  { id:'tournament', name:'比赛', icon:'🎯', category:'决斗系统' },
  { id:'location', name:'地点', icon:'📍', category:'世界与角色' },
  { id:'character', name:'角色', icon:'👤', category:'世界与角色' },
  { id:'event', name:'事件', icon:'📜', category:'剧情事件' },
];

const STAT_KEYS = ['search','expand','disrupt','resist','suppress'];
const STAT_NAMES = { search:'检索', expand:'展开', disrupt:'干扰', resist:'抗性', suppress:'压制', power:'强度', soul:'魂度', luck:'掏度', proficiency:'熟练度', intelligence:'情报力' };
const TYPE_LABELS = { monster:'怪兽', spell:'魔法', trap:'陷阱', extra:'额外' };
const RARITIES = ['N','R','SR','UR'];

// ===== 导航 =====
function renderSidebar() {
  const sb = document.getElementById('sidebar');
  const categories = {};
  TYPES.forEach(t => {
    if (!categories[t.category]) categories[t.category] = [];
    categories[t.category].push(t);
  });
  sb.innerHTML = Object.entries(categories).map(([cat, types]) => `
    <div class="nav-category">${cat}</div>
    ${types.map(t => `
      <div class="nav-item ${currentType===t.id?'active':''}" onclick="selectType('${t.id}')">
        <span class="nav-icon">${t.icon}</span>${t.name}
      </div>
    `).join('')}
  `).join('');
}

function selectType(type) {
  currentType = type;
  currentId = null;
  // 重置所有筛选条件
  cardFilterType = 'all';
  cardRarityFilter = 'all';
  talentFilter = 'all';
  opponentFilter = 'all';
  tournamentFilter = 'all';
  characterFilter = 'all';
  renderSidebar();
  const t = TYPES.find(x => x.id === type);
  document.getElementById('content-title').textContent = t.icon + ' ' + t.name + '管理';
  // 决斗配置是全局单例，不需要新建按钮，自动选中
  if (type === 'duelConfig') {
    document.getElementById('content-actions').innerHTML = '';
    currentId = 'duelConfig';
  } else if (type === 'gameConfig') {
    document.getElementById('content-actions').innerHTML = '';
    currentId = 'gameConfig';
  } else {
    document.getElementById('content-actions').innerHTML = `<button class="btn btn-gold btn-sm" onclick="addNew()">➕ 新建</button>`;
  }
  renderList();
  renderEditor();
}

// ===== 数据加载/保存 =====
function loadFile(event, type) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    if (type === 'card') {
      const match = text.match(/window\.CARD_DB\s*=\s*(\{[\s\S]*?\});?\s*$/);
      if (match) { try { cardDB = new Function('return ' + match[1])(); showToast('卡片数据加载成功，共 ' + Object.keys(cardDB).length + ' 张'); renderList(); } catch(err) { showToast('解析失败：' + err.message); } }
      else showToast('无法识别卡片数据格式');
    } else {
      // 解析 game-data.js 中的多个变量
      try {
        const talentMatch = text.match(/window\.TALENTS\s*=\s*(\[[\s\S]*?\]);/);
        const locMatch = text.match(/window\.LOCATIONS\s*=\s*(\[[\s\S]*?\]);/);
        const charMatch = text.match(/window\.CHARACTERS\s*=\s*(\[[\s\S]*?\]);/);
        const tourMatch = text.match(/window\.TOURNAMENTS\s*=\s*(\[[\s\S]*?\]);/);
        const achMatch = text.match(/window\.ACHIEVEMENTS\s*=\s*(\[[\s\S]*?\]);/);
        const evMatch = text.match(/window\.EVENTS\s*=\s*(\{[\s\S]*?\});\s*$/);
        if (talentMatch) gameData.talents = new Function('return ' + talentMatch[1])();
        if (locMatch) gameData.locations = new Function('return ' + locMatch[1])();
        if (charMatch) gameData.characters = new Function('return ' + charMatch[1])();
        if (tourMatch) gameData.tournaments = new Function('return ' + tourMatch[1])();
        if (achMatch) gameData.achievements = new Function('return ' + achMatch[1])();
        if (evMatch) gameData.events = new Function('return ' + evMatch[1])();
        showToast('游戏数据加载成功');
        renderList();
      } catch(err) { showToast('解析失败：' + err.message); }
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function saveAll() {
  // 保存卡片数据
  let cardOut = '/* 牌佬模拟器 - 卡片数据库 */\n\nwindow.CARD_DB = {\n\n';
  const groups = { monster:'怪兽卡', extra:'额外卡组', spell:'魔法卡', trap:'陷阱卡' };
  for (const [type, label] of Object.entries(groups)) {
    const cards = Object.values(cardDB).filter(c => c.type === type);
    if (!cards.length) continue;
    cardOut += '  // ' + label + '\n';
    cards.sort((a,b) => a.id.localeCompare(b.id));
    for (const c of cards) {
      cardOut += '  ' + c.id + ": { id:'" + c.id + "', name:'" + esc(c.name) +
        "', type:'" + c.type + "', rarity:'" + c.rarity +
        "', archetype:'" + esc(c.archetype||'') +
        "', stats:{search:" + (c.stats?.search||0) + ",expand:" + (c.stats?.expand||0) +
        ",disrupt:" + (c.stats?.disrupt||0) + ",resist:" + (c.stats?.resist||0) +
        ",suppress:" + (c.stats?.suppress||0) + "}, sub:{power:" + (c.sub?.power||0) +
        ",soul:" + (c.sub?.soul||0) + ",proficiency:" + (c.sub?.proficiency||0) + ",intelligence:" + (c.sub?.intelligence||0) + "} },\n";
    }
    cardOut += '\n';
  }
  cardOut += '};\n';
  download('card-data.js', cardOut);

  // 保存游戏数据
  let gameOut = '/* 牌佬模拟器 - 游戏数据配置 */\n\n';
  gameOut += 'window.TALENTS = ' + JSON.stringify(gameData.talents, null, 2) + ';\n\n';
  gameOut += 'window.LOCATIONS = ' + JSON.stringify(gameData.locations, null, 2) + ';\n\n';
  gameOut += 'window.CHARACTERS = ' + JSON.stringify(gameData.characters, null, 2) + ';\n\n';
  gameOut += 'window.TOURNAMENTS = ' + JSON.stringify(gameData.tournaments, null, 2) + ';\n\n';
  gameOut += 'window.ACHIEVEMENTS = ' + JSON.stringify(gameData.achievements, null, 2) + ';\n\n';
  gameOut += 'window.EVENTS = ' + JSON.stringify(gameData.events, null, 2) + ';\n';
  download('game-data.js', gameOut);

  showToast('已保存 card-data.js 和 game-data.js');
}

function download(name, content) {
  const blob = new Blob([content], { type:'text/javascript;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  URL.revokeObjectURL(url);
}

function downloadHTML(name, content) {
  const blob = new Blob([content], { type:'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  URL.revokeObjectURL(url);
}

// ===== 导入游戏本体 =====
function loadGameFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    originalGameFile = text;

    // 提取 GAME_DATA_START 和 GAME_DATA_END 之间的数据区域
    const startMarker = '/* === GAME_DATA_START ===';
    const endMarker = '/* === GAME_DATA_END ===';
    const startIdx = text.indexOf(startMarker);
    const endIdx = text.indexOf(endMarker);

    if (startIdx === -1 || endIdx === -1) {
      showToast('无法识别游戏本体格式，请确保文件包含 GAME_DATA 标记');
      return;
    }

    const dataSection = text.substring(startIdx, endIdx + endMarker.length);

    try {
      // 提取 CARD_DB
      const cardMatch = dataSection.match(/let CARD_DB\s*=\s*(\{[\s\S]*?\});/);
      if (cardMatch) {
        cardDB = new Function('return ' + cardMatch[1])();
      }

      // 提取 TALENTS
      const talentMatch = dataSection.match(/const TALENTS\s*=\s*(\[[\s\S]*?\]);/);
      if (talentMatch) gameData.talents = new Function('return ' + talentMatch[1])();

      // 提取 LOCATIONS
      const locMatch = dataSection.match(/const LOCATIONS\s*=\s*(\[[\s\S]*?\]);/);
      if (locMatch) gameData.locations = new Function('return ' + locMatch[1])();

      // 提取 CHARACTERS
      const charMatch = dataSection.match(/const CHARACTERS\s*=\s*(\[[\s\S]*?\]);/);
      if (charMatch) gameData.characters = new Function('return ' + charMatch[1])();

      // 提取 OPPONENTS
      const opMatch = dataSection.match(/const OPPONENTS\s*=\s*(\[[\s\S]*?\]);/);
      if (opMatch) gameData.opponents = new Function('return ' + opMatch[1])();

      // 提取 DUEL_CONFIG
      const dcMatch = dataSection.match(/const DUEL_CONFIG\s*=\s*(\{[\s\S]*?\});/);
      if (dcMatch) gameData.duelConfig = new Function('return ' + dcMatch[1])();

      // 提取 GAME_CONFIG
      const gcMatch = dataSection.match(/const GAME_CONFIG\s*=\s*(\{[\s\S]*?\});/);
      if (gcMatch) gameData.gameConfig = new Function('return ' + gcMatch[1])();

      // 提取 TOURNAMENTS
      const tourMatch = dataSection.match(/const TOURNAMENTS\s*=\s*(\[[\s\S]*?\]);/);
      if (tourMatch) gameData.tournaments = new Function('return ' + tourMatch[1])();

      // 提取 ACHIEVEMENTS
      const achMatch = dataSection.match(/const ACHIEVEMENTS\s*=\s*(\[[\s\S]*?\]);/);
      if (achMatch) gameData.achievements = new Function('return ' + achMatch[1])();

      // 提取 TASKS
      const taskMatch = dataSection.match(/const TASKS\s*=\s*(\[[\s\S]*?\]);/);
      if (taskMatch) gameData.tasks = new Function('return ' + taskMatch[1])();

      // 提取 EVENTS
      const evMatch = dataSection.match(/const EVENTS\s*=\s*(\{[\s\S]*?\});/);
      if (evMatch) gameData.events = new Function('return ' + evMatch[1])();

      // 提取 REDEEM_CODES
      const rcMatch = dataSection.match(/const REDEEM_CODES\s*=\s*(\[[\s\S]*?\]);/);
      if (rcMatch) gameData.redeemCodes = new Function('return ' + rcMatch[1])();

      // 提取 CARD_BOXES
      const cbMatch = dataSection.match(/const CARD_BOXES\s*=\s*(\[[\s\S]*?\]);/);
      if (cbMatch) gameData.cardBoxes = new Function('return ' + cbMatch[1])();

      // 显示导出按钮
      document.getElementById('export-btn').style.display = 'inline-block';

      showToast('游戏本体导入成功！卡片 ' + Object.keys(cardDB).length + ' 张，天赋 ' + gameData.talents.length + ' 个，卡盒 ' + gameData.cardBoxes.length + ' 个');
      renderList();
    } catch(err) {
      showToast('解析失败：' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ===== 导出游戏本体 =====
function exportGameFile() {
  if (!originalGameFile) {
    showToast('请先导入游戏本体文件');
    return;
  }

  // 生成新的数据区域
  let newDataSection = '/* === GAME_DATA_START === 以下数据可由 dev-tool.html 直接编辑 === */\n\n';

  // CARD_DB
  newDataSection += '// ===== 卡片数据库 =====\nlet CARD_DB = {\n\n';
  const groups = { monster:'怪兽卡', extra:'额外卡组', spell:'魔法卡', trap:'陷阱卡' };
  for (const [type, label] of Object.entries(groups)) {
    const cards = Object.values(cardDB).filter(c => c.type === type);
    if (!cards.length) continue;
    newDataSection += '  // ' + label + '\n';
    cards.sort((a,b) => a.id.localeCompare(b.id));
    for (const c of cards) {
      newDataSection += '  ' + c.id + ": { id:'" + c.id + "', name:'" + esc(c.name) +
        "', type:'" + c.type + "', rarity:'" + c.rarity +
        "', archetype:'" + esc(c.archetype||'') +
        "', stats:{search:" + (c.stats?.search||0) + ",expand:" + (c.stats?.expand||0) +
        ",disrupt:" + (c.stats?.disrupt||0) + ",resist:" + (c.stats?.resist||0) +
        ",suppress:" + (c.stats?.suppress||0) + "}, sub:{power:" + (c.sub?.power||0) +
        ",soul:" + (c.sub?.soul||0) + ",proficiency:" + (c.sub?.proficiency||0) + ",intelligence:" + (c.sub?.intelligence||0) + "} },\n";
    }
    newDataSection += '\n';
  }
  newDataSection += '};\n\n';

  // TALENTS
  newDataSection += '// ===== 天赋定义 =====\nconst TALENTS = ' + JSON.stringify(gameData.talents, null, 2) + ';\n\n';

  // OPPONENTS
  newDataSection += '// ===== 对手/NPC数据库（可由开发工具编辑）=====\nconst OPPONENTS = ' + JSON.stringify(gameData.opponents, null, 2) + ';\n\n';

  // DUEL_CONFIG
  newDataSection += '// ===== 决斗配置（可由开发工具编辑）=====\nconst DUEL_CONFIG = ' + JSON.stringify(gameData.duelConfig, null, 2) + ';\n\n';

  // GAME_CONFIG
  newDataSection += '// ===== 核心数据配置（全局设置 + 精灵力系统）=====\nconst GAME_CONFIG = ' + JSON.stringify(gameData.gameConfig, null, 2) + ';\n\n';

  // CARD_BOXES
  newDataSection += '// ===== 系列卡盒数据 =====\nconst CARD_BOXES = ' + JSON.stringify(gameData.cardBoxes || [], null, 2) + ';\n\n';

  // LOCATIONS
  newDataSection += '// ===== 地点定义 =====\nconst LOCATIONS = ' + JSON.stringify(gameData.locations, null, 2) + ';\n\n';

  // CHARACTERS
  newDataSection += '// ===== 角色定义 =====\nconst CHARACTERS = ' + JSON.stringify(gameData.characters, null, 2) + ';\n\n';

  // TOURNAMENTS
  newDataSection += '// ===== 比赛定义 =====\nconst TOURNAMENTS = ' + JSON.stringify(gameData.tournaments, null, 2) + ';\n\n';

  // ACHIEVEMENTS
  newDataSection += '// ===== 成就定义 =====\nconst ACHIEVEMENTS = ' + JSON.stringify(gameData.achievements, null, 2) + ';\n\n';

  // TASKS
  newDataSection += '// ===== 任务定义 =====\nconst TASKS = ' + JSON.stringify(gameData.tasks || [], null, 2) + ';\n\n';

  // EVENTS
  newDataSection += '// ===== 事件定义 =====\nconst EVENTS = ' + JSON.stringify(gameData.events, null, 2) + ';\n\n';

  // REDEEM_CODES
  newDataSection += '// ===== 兑换码数据 =====\nconst REDEEM_CODES = ' + JSON.stringify(gameData.redeemCodes || [], null, 2) + ';\n\n';

  newDataSection += '/* === GAME_DATA_END === 以上数据可由 dev-tool.html 直接编辑 === */';

  // 替换原始文件中的数据区域
  const startMarker = '/* === GAME_DATA_START ===';
  const endMarker = '/* === GAME_DATA_END ===';
  const startIdx = originalGameFile.indexOf(startMarker);
  const endIdx = originalGameFile.indexOf(endMarker);

  if (startIdx === -1 || endIdx === -1) {
    showToast('原始文件格式错误，无法导出');
    return;
  }

  // 找到 endMarker 所在注释块的结束位置（包含 */ 和后面的换行）
  let endPos = endIdx + endMarker.length;
  // 找到注释结束符 */ 的位置
  const commentEnd = originalGameFile.indexOf('*/', endPos);
  if (commentEnd !== -1) {
    endPos = commentEnd + 2;
  }
  // 跳过后面的换行符
  while (endPos < originalGameFile.length && (originalGameFile[endPos] === '\n' || originalGameFile[endPos] === '\r')) {
    endPos++;
  }

  const newFile = originalGameFile.substring(0, startIdx) + newDataSection + '\n' + originalGameFile.substring(endPos);

  downloadHTML('duelist-simulator.html', newFile);
  showToast('游戏本体已导出！请覆盖原文件');
}

// ===== 卡片导入功能 =====
let importCardList = []; // 待导入的卡片列表

function handleCardFileImport(event) {
  const files = event.target.files;
  if (!files || files.length === 0) return;
  
  let processed = 0;
  let errors = 0;
  
  for (const file of files) {
    if (!file.name.endsWith('.json')) continue;
    
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const card = JSON.parse(e.target.result);
        if (card.id && card.name && card.type) {
          // 检查是否已存在
          const exists = cardDB[card.id] ? '已存在(覆盖)' : '新卡';
          importCardList.push({
            ...card,
            _importSelected: true,
            _importStatus: exists
          });
        } else {
          errors++;
        }
      } catch(err) {
        errors++;
      }
      processed++;
      if (processed >= files.length) {
        updateImportStatus();
        renderImportList();
      }
    };
    reader.readAsText(file, 'UTF-8');
  }
  
  // 重置input，允许重复选择同一文件
  event.target.value = '';
}

function updateImportStatus() {
  const status = document.getElementById('import-status');
  if (status) {
    const selected = importCardList.filter(c => c._importSelected).length;
    status.textContent = `待导入: ${importCardList.length} 张 (已选 ${selected})`;
  }
}

function renderImportList() {
  const panel = document.getElementById('import-list-panel');
  const container = document.getElementById('import-list-items');
  if (!panel || !container) return;
  
  if (importCardList.length === 0) {
    panel.style.display = 'none';
    return;
  }
  
  panel.style.display = 'block';
  
  const typeLabels = { monster:'怪兽', spell:'魔法', trap:'陷阱', extra:'额外' };
  
  container.innerHTML = importCardList.map((card, i) => `
    <div style="display:flex;align-items:center;gap:8px;padding:6px;border-bottom:1px solid var(--border);font-size:11px;">
      <input type="checkbox" ${card._importSelected?'checked':''} onchange="toggleImportSelect(${i})" style="margin:0;">
      <span class="rarity-dot ${card.rarity}" style="width:8px;height:8px;border-radius:50%;display:inline-block;"></span>
      <span style="font-weight:bold;min-width:120px;">${card.name}</span>
      <span style="color:var(--text2);min-width:50px;">[${typeLabels[card.type]||card.type}]</span>
      <span style="color:var(--text2);min-width:40px;">${card.rarity}</span>
      <span style="color:var(--text2);flex:1;">${card.archetype||''}</span>
      <span style="color:${card._importStatus==='新卡'?'#22c55e':'#f59e0b'};font-weight:bold;">${card._importStatus}</span>
    </div>
  `).join('');
}

function toggleImportSelect(index) {
  if (importCardList[index]) {
    importCardList[index]._importSelected = !importCardList[index]._importSelected;
    updateImportStatus();
  }
}

function toggleSelectAllImport(select) {
  importCardList.forEach(c => c._importSelected = select);
  renderImportList();
  updateImportStatus();
}

async function executeCardImport() {
  const selected = importCardList.filter(c => c._importSelected);
  if (selected.length === 0) {
    showToast('请先选择要导入的卡片');
    return;
  }
  
  // 检查哪些会被覆盖
  const overwriteCards = selected.filter(c => cardDB[c.id]);
  const newCards = selected.filter(c => !cardDB[c.id]);
  
  if (overwriteCards.length > 0) {
    // 弹出确认对话框
    const confirmResult = await confirmImportOverwrite(overwriteCards.length, newCards.length);
    if (confirmResult === 'cancel') return;
    if (confirmResult === 'onlyNew') {
      // 只导入新卡，跳过已存在的
      selected.forEach(c => {
        if (cardDB[c.id]) c._importSelected = false;
      });
    }
    // 'overwrite' 继续执行覆盖
  }
  
  let newCount = 0;
  let overwriteCount = 0;
  
  for (const card of selected) {
    if (!card._importSelected) continue;
    const isNew = !cardDB[card.id];
    const { _importSelected, _importStatus, ...cleanCard } = card;
    cardDB[cleanCard.id] = cleanCard;
    if (isNew) newCount++;
    else overwriteCount++;
  }
  
  importCardList = importCardList.filter(c => !c._importSelected);
  
  showToast(`导入成功！新增 ${newCount} 张，覆盖 ${overwriteCount} 张`);
  renderImportList();
  updateImportStatus();
  renderList();
}

function confirmImportOverwrite(overwriteCount, newCount) {
  // 创建自定义确认对话框
  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:10000;';
  
  modal.innerHTML = `
    <div style="background:var(--bg-card);border:1px solid var(--border-accent);border-radius:12px;padding:24px;max-width:420px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.5);">
      <div style="font-size:18px;font-weight:bold;margin-bottom:16px;color:var(--accent-orange);">⚠️ 发现重复卡片</div>
      <div style="font-size:13px;color:var(--text);line-height:1.8;margin-bottom:20px;">
        待导入的卡片中，有 <span style="color:var(--accent-orange);font-weight:bold;">${overwriteCount}</span> 张已存在于数据库中。
        <br>新增卡片: <span style="color:var(--accent-green);font-weight:bold;">${newCount}</span> 张
        <br><br>
        已存在的卡片将被覆盖，是否继续？
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button id="import-cancel" style="padding:8px 16px;background:var(--bg-input);border:1px solid var(--border);border-radius:6px;color:var(--text2);cursor:pointer;font-size:13px;">取消</button>
        <button id="import-only-new" style="padding:8px 16px;background:var(--accent-green);border:none;border-radius:6px;color:white;cursor:pointer;font-size:13px;">仅导入新卡</button>
        <button id="import-overwrite" style="padding:8px 16px;background:var(--accent-orange);border:none;border-radius:6px;color:white;cursor:pointer;font-size:13px;">全部覆盖</button>
      </div>
    </div>
  `;
  
  document.body.appendChild(modal);
  
  return new Promise((resolve) => {
    document.getElementById('import-cancel').onclick = () => {
      document.body.removeChild(modal);
      resolve('cancel');
    };
    document.getElementById('import-only-new').onclick = () => {
      document.body.removeChild(modal);
      resolve('onlyNew');
    };
    document.getElementById('import-overwrite').onclick = () => {
      document.body.removeChild(modal);
      resolve('overwrite');
    };
  });
}

  if (currentType === 'talent' && talentFilter !== 'all') {
    if (talentFilter === 'hidden') {
      items = items.filter(i => i.hidden === true);
    } else {
      items = items.filter(i => (i.rarity || 'N') === talentFilter);
    }
  }
  // 对手类型筛选
  if (currentType === 'opponent' && opponentFilter !== 'all') {
    items = items.filter(i => (i.category || 'normal') === opponentFilter);
  }
  // 比赛级别筛选
  if (currentType === 'tournament' && tournamentFilter !== 'all') {
    items = items.filter(i => i.tier === tournamentFilter);
  }
  // 角色筛选
  if (currentType === 'character' && characterFilter !== 'all') {
    if (characterFilter === 'challenge') {
      items = items.filter(i => i.canChallenge === true);
    } else if (characterFilter === 'gift') {
      items = items.filter(i => i.giftCard);
    }
  }
  // 搜索（同时支持名称和ID，以及描述等字段）
  if (search) {
    const s = search.toLowerCase();
    items = items.filter(i => {
      const name = (i.name||'').toLowerCase();
      const id = (i.id||'').toLowerCase();
      const desc = (i.desc||'').toLowerCase();
      const archetype = (i.archetype||'').toLowerCase();
      return name.includes(s) || id.includes(s) || desc.includes(s) || archetype.includes(s);
    });
  }
  document.getElementById('list-count').textContent = '共 ' + items.length + ' 条';
  const el = document.getElementById('list-items');
  if (!items.length) { el.innerHTML = '<div style="text-align:center;color:var(--text2);padding:20px;font-size:12px;">暂无数据</div>'; return; }
  el.innerHTML = items.map(item => {
    const dot = currentType==='card' ? `<div class="rarity-dot ${item.rarity}"></div>` : '';
    const loc = currentType==='event' ? `<span style="font-size:10px;color:var(--text2);">[${item._location}]</span>` : '';
    // 根据数据类型显示额外信息
    let extraInfo = '';
    if (currentType === 'card') {
      extraInfo = `<span style="font-size:10px;color:var(--text2);">[${item.rarity}]</span>`;
    } else if (currentType === 'talent') {
      const typeLabel = item.hidden ? '隐藏' : (item.rarity || 'N');
      extraInfo = `<span style="font-size:10px;color:var(--text2);">[${typeLabel}]</span>`;
    } else if (currentType === 'opponent') {
      const catLabels = { normal:'普通对手', event:'事件专用', tournament:'比赛专用', story:'剧情角色', special:'特殊分类' };
      const catLabel = catLabels[item.category] || item.category || '普通对手';
      const styleLabel = item.playStyle === 'expand' ? '展开型' : item.playStyle === 'disrupt' ? '干扰型' : item.playStyle === 'beat' ? '防御型' : '均衡型';
      extraInfo = `<span style="font-size:10px;color:var(--accent-blue);">[${catLabel}]</span> <span style="font-size:10px;color:var(--text2);">[${styleLabel} · 难度${item.difficulty} · ${item.basePower}±${item.variance}]</span>`;
    } else if (currentType === 'tournament') {
      extraInfo = `<span style="font-size:10px;color:var(--text2);">[${item.tier} · ${item.rounds||3}轮]</span>`;
    } else if (currentType === 'character') {
      const tags = [];
      if (item.canChallenge) tags.push('可挑战');
      if (item.giftCard) tags.push('有赠礼');
      extraInfo = tags.length ? `<span style="font-size:10px;color:var(--text2);">[${tags.join('/')}]</span>` : '';
    } else if (currentType === 'achievement') {
      extraInfo = `<span style="font-size:10px;color:var(--text2);">[${item.condition?.type || ''}]</span>`;
    } else if (currentType === 'redeemCode') {
      const reward = item.reward || {};
      const parts = [];
      if (reward.duelPoints) parts.push(`${reward.duelPoints}点`);
      if (reward.cards) parts.push(`${reward.cards.length}卡`);
      if (reward.title) parts.push('称号');
      if (reward.achievement) parts.push('成就');
      if (reward.talent) parts.push('天赋');
      if (reward.spiritPower) parts.push('精灵力');
      extraInfo = parts.length ? `<span style="font-size:10px;color:var(--text2);">[${parts.join('/')}]</span>` : '';
    }
    return `<div class="list-item ${currentId===item.id?'active':''}" onclick="selectItem('${item.id}')">
      ${dot}<div class="list-item-name">${item.name||item.id}</div>${extraInfo}${loc}
      <div class="list-item-del" onclick="event.stopPropagation();deleteItem('${item.id}')">×</div>
    </div>`;
  }).join('');
}

function selectItem(id) {
  currentId = id;
  renderListItems();
  renderEditor();
}

function deleteItem(id) {
  if (currentType === 'duelConfig') { showToast('决斗配置为全局配置，不可删除'); return; }
  if (currentType === 'gameConfig') { showToast('核心配置为全局配置，不可删除'); return; }
  if (!confirm('确定删除？此操作不可恢复。')) return;
  if (currentType === 'card') { delete cardDB[id]; }
  else if (currentType === 'event') {
    for (const loc of Object.keys(gameData.events)) {
      gameData.events[loc] = gameData.events[loc].filter(e => e.id !== id);
    }
  }
  else {
    const key = currentType + 's';
    const arrKey = currentType === 'talent' ? 'talents' : currentType === 'achievement' ? 'achievements' : currentType === 'cardBox' ? 'cardBoxes' : currentType + 's';
    gameData[arrKey] = gameData[arrKey].filter(i => i.id !== id);
  }
  if (currentId === id) currentId = null;
  renderList();
  showToast('已删除');
}

function addNew() {
  const id = prompt('请输入ID（英文/数字，唯一）：');
  if (!id) return;
  let newItem;
  switch(currentType) {
    case 'card':
      if (cardDB[id]) { showToast('ID已存在'); return; }
      newItem = { id, name:'新卡片', type:'monster', rarity:'N', archetype:'', stats:{search:0,expand:0,disrupt:0,resist:0,suppress:0}, sub:{power:0,soul:0,proficiency:0,intelligence:0} };
      cardDB[id] = newItem; break;
    case 'talent':
      if (gameData.talents.find(t=>t.id===id)) { showToast('ID已存在'); return; }
      newItem = { id, name:'新天赋', rarity:'N', desc:'', effects:{}, bonus:{} };
      gameData.talents.push(newItem); break;
    case 'opponent':
      if (gameData.opponents.find(o=>o.id===id)) { showToast('ID已存在'); return; }
      newItem = { id, name:'新对手', basePower:100, variance:50, difficulty:1, desc:'' };
      gameData.opponents.push(newItem); break;
    case 'achievement':
      if (gameData.achievements.find(a=>a.id===id)) { showToast('ID已存在'); return; }
      newItem = { id, name:'新成就', desc:'', condition:{type:'collection_count',value:1}, bonus:{} };
      gameData.achievements.push(newItem); break;
    case 'task':
      if (!gameData.tasks) gameData.tasks = [];
      if (gameData.tasks.find(t=>t.id===id)) { showToast('ID已存在'); return; }
      newItem = { id, name:'新任务', type:'guide', order:1, desc:'', story:'', condition:{type:'collect_cards',value:10}, reward:{} };
      gameData.tasks.push(newItem); break;
    case 'location':
      if (gameData.locations.find(l=>l.id===id)) { showToast('ID已存在'); return; }
      newItem = { id, name:'新地点', desc:'', tags:[] };
      gameData.locations.push(newItem); break;
    case 'character':
      if (gameData.characters.find(c=>c.id===id)) { showToast('ID已存在'); return; }
      newItem = { id, name:'新角色', desc:'', avatar:'?', giftCard:'', canChallenge:false, power:100, challengeReward:'', challengeDesc:'' };

    case 'tournament':
      if (gameData.tournaments.find(t=>t.id===id)) { showToast('ID已存在'); return; }
      newItem = { id, name:'新比赛', tier:'入门', duelMode:'quick', desc:'', entryCost:0, requirement:{mainDeck:20}, conditions:[{type:'collect_cards',operator:'>=',value:10}], rounds:3, opponentNames:['初赛对手','半决赛对手','决赛对手'], opponentBasePower:60, opponentPowerGrowth:0.25, rewardRarities:['N','R'], rewardCardCount:1, duelPointsWin:500, duelPointsLose:50, rewards:'', bonusStats:{}, difficulty:1 };
      gameData.tournaments.push(newItem); break;
    case 'redeemCode':
      if (!gameData.redeemCodes) gameData.redeemCodes = [];
      if (gameData.redeemCodes.find(r=>r.id===id)) { showToast('ID已存在'); return; }
      newItem = { id, name:'新兑换码', desc:'', reward:{ duelPoints:100 } };
      gameData.redeemCodes.push(newItem); break;
    case 'cardBox':
      if (!gameData.cardBoxes) gameData.cardBoxes = [];
      if (gameData.cardBoxes.find(b=>b.id===id)) { showToast('ID已存在'); return; }
      newItem = { id, name:'新卡盒', desc:'', cardIds:[], cardsPerPack:5, packPrice:500, tenPackDiscount:0.8, defaultCopies:3 };
      gameData.cardBoxes.push(newItem); break;
    case 'event':
      const loc = prompt('请输入地点ID（如 kame/cardshop/beach）：');
      if (!loc) return;
      if (!gameData.events[loc]) gameData.events[loc] = [];
      newItem = { id, name:'新事件', probability:0.5, title:'', text:'', effects:[{type:'text'}], log:'' };
      gameData.events[loc].push(newItem); break;
  }
  currentId = id;
  renderList();
  showToast('已创建');
}

// ===== 编辑器 =====
function getItem() {
  if (!currentId) return null;
  switch(currentType) {
    case 'card': return cardDB[currentId];
    case 'talent': return gameData.talents.find(t=>t.id===currentId);
    case 'opponent': return gameData.opponents.find(o=>o.id===currentId);
    case 'duelConfig': return gameData.duelConfig;
    case 'gameConfig': return gameData.gameConfig;
    case 'achievement': return gameData.achievements.find(a=>a.id===currentId);
    case 'task': return (gameData.tasks||[]).find(t=>t.id===currentId);
    case 'location': return gameData.locations.find(l=>l.id===currentId);
    case 'character': return gameData.characters.find(c=>c.id===currentId);
    case 'tournament': return gameData.tournaments.find(t=>t.id===currentId);
    case 'redeemCode': return (gameData.redeemCodes||[]).find(r=>r.id===currentId);
    case 'cardBox': return (gameData.cardBoxes||[]).find(b=>b.id===currentId);
    case 'event':
      for (const list of Object.values(gameData.events)) {
        const e = list.find(x=>x.id===currentId);
        if (e) return e;
      }
      return null;
  }
}

function renderEditor() {
  const panel = document.getElementById('edit-panel');
  if (!panel) return;
  const item = getItem();
  if (!item) {
    panel.innerHTML = '<div class="empty"><div class="empty-icon">✏️</div><div>从左侧选择要编辑的项目</div></div>';
    return;
  }
  switch(currentType) {
    case 'card': panel.innerHTML = renderCardEditor(item); bindCardEvents(item); break;
    case 'talent': panel.innerHTML = renderTalentEditor(item); bindTalentEvents(item); break;
    case 'opponent': panel.innerHTML = renderOpponentEditor(item); bindOpponentEvents(item); break;
    case 'duelConfig': panel.innerHTML = renderDuelConfigEditor(item); bindDuelConfigEvents(item); break;
    case 'gameConfig': panel.innerHTML = renderGameConfigEditor(item); bindGameConfigEvents(item); break;
    case 'achievement': panel.innerHTML = renderAchievementEditor(item); bindAchievementEvents(item); break;
    case 'task': panel.innerHTML = renderTaskEditor(item); bindTaskEvents(item); break;
    case 'location': panel.innerHTML = renderLocationEditor(item); bindLocationEvents(item); break;
    case 'character': panel.innerHTML = renderCharacterEditor(item); bindCharacterEvents(item); break;
    case 'tournament': panel.innerHTML = renderTournamentEditor(item); bindTournamentEvents(item); break;
    case 'redeemCode': panel.innerHTML = renderRedeemCodeEditor(item); bindRedeemCodeEvents(item); break;
    case 'cardBox': panel.innerHTML = renderCardBoxEditor(item); bindCardBoxEvents(item); break;
    case 'event': panel.innerHTML = renderEventEditor(item); bindEventEvents(item); break;
  }
}

function bindCardEvents(c) {
  ['name','id','archetype'].forEach(f => {
    document.getElementById('f-'+f).oninput = e => {
      if (f === 'id') {
        if (cardDB[e.target.value] && e.target.value !== c.id) { showToast('ID已存在'); e.target.value=c.id; return; }
        delete cardDB[c.id]; c.id = e.target.value; cardDB[c.id] = c; currentId = c.id;
      } else c[f] = e.target.value;
      renderListItems();
    };
  });
  document.getElementById('f-type').onchange = e => { c.type = e.target.value; renderListItems(); };
  document.getElementById('f-rarity').onchange = e => { c.rarity = e.target.value; renderListItems(); };
  const specialEl = document.getElementById('f-special');
  if (specialEl) specialEl.onchange = e => {
    c.special = e.target.checked;
    const group = document.getElementById('f-awaken-ach-group');
    if (group) group.style.display = c.special ? '' : 'none';
    renderListItems();
  };
  const awakenAchEl = document.getElementById('f-awaken-ach');
  if (awakenAchEl) awakenAchEl.oninput = e => {
    const val = e.target.value.trim();
    if (val) c.awakenAchievement = val; else delete c.awakenAchievement;
  };
  // 卡灵觉醒配置
  const canAwakenEl = document.getElementById('f-can-awaken');
  if (canAwakenEl) canAwakenEl.onchange = e => {
    if (e.target.checked) { c.canAwaken = true; delete c.canAwakenFalse; }
    else delete c.canAwaken;
    renderListItems();
  };
  const noAwakenEl = document.getElementById('f-no-awaken');
  if (noAwakenEl) noAwakenEl.onchange = e => {
    if (e.target.checked) { c.canAwaken = false; }
    else delete c.canAwaken;
    renderListItems();
  };
  const awakenCostEl = document.getElementById('f-awaken-cost');
  if (awakenCostEl) awakenCostEl.oninput = e => {
    const val = e.target.value.trim();
    if (val !== '') c.awakenCost = parseInt(val); else delete c.awakenCost;
  };
  const awakenRateEl = document.getElementById('f-awaken-rate');
  if (awakenRateEl) awakenRateEl.oninput = e => {
    const val = e.target.value.trim();
    if (val !== '') c.awakenRate = parseFloat(val); else delete c.awakenRate;
  };
  const awakenMultEl = document.getElementById('f-awaken-mult');
  if (awakenMultEl) awakenMultEl.oninput = e => {
    const val = e.target.value.trim();
    if (val !== '') c.awakenMultiplier = parseFloat(val); else delete c.awakenMultiplier;
  };
  STAT_KEYS.forEach(k => {
    document.getElementById('s-'+k).oninput = e => {
      if (!c.stats) c.stats = {};
      c.stats[k] = parseInt(e.target.value);
      document.getElementById('val-'+k).textContent = e.target.value;
    };
  });
  ['power','soul','proficiency','intelligence'].forEach(k => {
    document.getElementById('s-'+k).oninput = e => {
      if (!c.sub) c.sub = {};
      c.sub[k] = parseInt(e.target.value);
      document.getElementById('val-'+k).textContent = e.target.value;
    };
  });
}

// ===== 对手编辑器 =====
const OPPONENT_CATEGORIES = [
  {v:'normal', l:'普通对手'},
  {v:'event', l:'事件专用'},
  {v:'tournament', l:'比赛专用'},
  {v:'story', l:'剧情角色'},
  {v:'special', l:'特殊分类'}
];

function renderOpponentEditor(o) {
  if (!o.category) o.category = 'normal';
  if (!o.specialTag) o.specialTag = '';
  if (!o.stats) o.stats = {};
  if (!o.rewards) o.rewards = {};
  if (o.enabled === undefined) o.enabled = true;

  // 合并预定义分类和自定义分类
  const defaultCats = OPPONENT_CATEGORIES.map(c => c.v);
  const customCats = [...new Set(gameData.opponents.map(op => op.category).filter(c => c && !defaultCats.includes(c)))];
  const allCategoryOptions = [
    ...OPPONENT_CATEGORIES,
    ...customCats.map(c => ({v: c, l: gameData.opponents.find(op => op.category === c)?.categoryLabel || c}))
  ];

  return `
    <div class="edit-section">
      <div class="edit-section-title">基本信息</div>
      <div class="form-row">
        <div class="form-group"><label>名称</label><input type="text" id="f-name" value="${o.name}"></div>
        <div class="form-group"><label>ID</label><input type="text" id="f-id" value="${o.id}"></div>
        <div class="form-group"><label>分类</label><select id="f-category">
          ${allCategoryOptions.map(c=>`<option value="${c.v}" ${o.category===c.v?'selected':''}>${c.l}</option>`).join('')}
        </select></div>
        <div class="form-group"><label>启用</label><select id="f-enabled">
          <option value="true" ${o.enabled?'selected':''}>启用</option>
          <option value="false" ${!o.enabled?'selected':''}>禁用</option>
        </select></div>
      </div>
      <div class="form-group"><label>特殊标签（可被事件/比赛单独调用，如 gambler/legend/mysterious）</label><input type="text" id="f-specialtag" value="${o.specialTag||''}" placeholder="如 gambler"></div>
      <div class="form-group"><label>描述</label><textarea id="f-desc">${o.desc||''}</textarea></div>
    </div>
    <div class="edit-section">
      <div class="edit-section-title">牌力设置</div>
      <div class="form-row">
        <div class="form-group"><label>基础牌力</label><input type="number" id="f-basepower" value="${o.basePower||0}" step="10" min="0" max="10000"></div>
        <div class="form-group"><label>牌力波动（随机+0~波动值）</label><input type="number" id="f-variance" value="${o.variance||0}" step="10" min="0" max="5000"></div>
        <div class="form-group"><label>难度等级（1-10）</label><input type="number" id="f-difficulty" value="${o.difficulty||1}" step="1" min="1" max="10"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>行为模式</label><select id="f-playstyle">
          <option value="balance" ${o.playStyle==='balance'?'selected':''}>均衡型</option>
          <option value="expand" ${o.playStyle==='expand'?'selected':''}>展开型（展开+20%，干扰压制-30%）</option>
          <option value="disrupt" ${o.playStyle==='disrupt'?'selected':''}>干扰型（展开-20%，干扰压制+30%）</option>
          <option value="beat" ${o.playStyle==='beat'?'selected':''}>防御型（展开-20%，干扰压制+10%，抗性+30%）</option>
        </select></div>
      </div>
      <div style="font-size:12px;color:var(--text-secondary);margin-top:8px;">
        实际牌力 = 基础牌力 + 随机(0~波动值) × 时间增长倍率 × 模式倍率
      </div>
    </div>
    <div class="edit-section">
      <div class="edit-section-title">卡组与属性（可选，用于特殊对手）</div>
      <div class="form-row">
        <div class="form-group"><label>卡组系列</label><input type="text" id="f-archetype" value="${o.deckArchetype||''}" placeholder="如 青眼/黑魔术"></div>
      </div>
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px;">对手属性（影响决斗行为，可选填）</div>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;">
        ${[['search','检索'],['expand','展开'],['disrupt','干扰'],['resist','抗性'],['suppress','压制']].map(([k,n])=>`
          <div style="display:flex;flex-direction:column;gap:2px;">
            <span style="font-size:10px;color:var(--text2);">${n}</span>
            <input type="number" id="op-stat-${k}" value="${o.stats[k]||0}" min="0" style="width:100%;">
          </div>
        `).join('')}
      </div>
    </div>
    <div class="edit-section">
      <div class="edit-section-title">击败奖励（可选，用于特殊对手）</div>
      <div class="form-row">
        <div class="form-group"><label>胜利决斗点</label><input type="number" id="op-reward-dp" value="${o.rewards.duelPoints||0}" min="0"></div>
        <div class="form-group"><label>胜利卡点</label><input type="number" id="op-reward-cp" value="${o.rewards.cardPoints||0}" min="0"></div>
        <div class="form-group"><label>寿命奖励（天）</label><input type="number" id="op-reward-days" value="${o.rewards.days||0}" min="0" placeholder="击败后增加寿命"></div>
        <div class="form-group"><label>奖励卡片ID</label><input type="text" id="op-reward-card" value="${o.rewards.cardId||''}" placeholder="如 m001"></div>
      </div>
    </div>
  `;
}

  document.getElementById('f-name').oninput = e => { o.name=e.target.value; renderListItems(); };
  document.getElementById('f-id').oninput = e => { o.id=e.target.value; renderListItems(); };

  document.getElementById('f-difficulty').oninput = e => { o.difficulty = parseInt(e.target.value) || 1; };
  document.getElementById('f-playstyle').onchange = e => { o.playStyle = e.target.value; };

    o.rewards.duelPoints = parseInt(e.target.value) || 0;
  };
  document.getElementById('op-reward-cp').oninput = e => {
    if (!o.rewards) o.rewards = {};
    o.rewards.cardPoints = parseInt(e.target.value) || 0;
  };
  document.getElementById('op-reward-days').oninput = e => {

function switchDuelMode(modeId) {
  currentDuelMode = modeId;
  renderEditor();
}

function addDuelMode() {
  const dc = gameData.duelConfig;
  if (!dc.modes) dc.modes = {};
  let newId = 'custom1';
  let idx = 1;
  while (dc.modes[newId]) {
    idx++;
    newId = 'custom' + idx;
  }
  dc.modes[newId] = {
    name: '自定义决斗', enabled: true, maxTurns: 30, playerBasePower: 100, modeBonus: 1.0,
    opponentMinDifficulty: 0, opponentMaxDifficulty: 5, opponentCategory: 'normal',
    mainDeckMin: 20, mainDeckMax: 60, extraDeckMin: 0, extraDeckMax: 15, gambleEnabled: true,
    winDuelPoints: 300, loseDuelPoints: 100, winCardPoints: 0, loseCardPoints: 0,
    winStats: {}, loseStats: {}, battleEventBaseRate: 0.3, archetypeEventBonus: 0.15
  };
  currentDuelMode = newId;
  renderEditor();
  showToast('已添加新决斗模式：' + newId);
}

function bindDuelConfigEvents(dc) {
  const mode = dc.modes[currentDuelMode];
  if (!mode) return;

  document.getElementById('dm-name').oninput = e => { mode.name = e.target.value; };
  document.getElementById('dm-enabled').onchange = e => { mode.enabled = e.target.value === 'true'; };
  document.getElementById('dm-maxturns').oninput = e => { mode.maxTurns = parseInt(e.target.value) || 30; };
  document.getElementById('dm-playerbase').oninput = e => { mode.playerBasePower = parseInt(e.target.value) || 100; };
  document.getElementById('dm-modebonus').oninput = e => { mode.modeBonus = parseFloat(e.target.value) || 1.0; };
  document.getElementById('dm-gamble').onchange = e => { mode.gambleEnabled = e.target.value === 'true'; };
  document.getElementById('dm-oppcategory').onchange = e => { mode.opponentCategory = e.target.value; };
  document.getElementById('dm-oppmin').oninput = e => { mode.opponentMinDifficulty = parseInt(e.target.value) || 0; };
  document.getElementById('dm-oppmax').oninput = e => { mode.opponentMaxDifficulty = parseInt(e.target.value) || 3; };
  // 难度权重匹配配置
  const diffWeightEl = document.getElementById('dm-difficultyweight');
  if (diffWeightEl) diffWeightEl.onchange = e => { mode.difficultyWeightEnabled = e.target.value === 'true'; };
  const weightBaseEl = document.getElementById('dm-weightbase');
  if (weightBaseEl) weightBaseEl.oninput = e => { mode.difficultyWeightBase = parseFloat(e.target.value) || 11; };
  const weightMinEl = document.getElementById('dm-weightmin');
  if (weightMinEl) weightMinEl.oninput = e => { mode.difficultyWeightMin = parseFloat(e.target.value) || 0.5; };
  document.getElementById('dm-mainmin').oninput = e => { mode.mainDeckMin = parseInt(e.target.value) || 20; };
  document.getElementById('dm-mainmax').oninput = e => { mode.mainDeckMax = parseInt(e.target.value) || 60; };
  document.getElementById('dm-extramin').oninput = e => { mode.extraDeckMin = parseInt(e.target.value) || 0; };
  document.getElementById('dm-extramax').oninput = e => { mode.extraDeckMax = parseInt(e.target.value) || 15; };
  document.getElementById('dm-windp').oninput = e => { mode.winDuelPoints = parseInt(e.target.value) || 0; };
  document.getElementById('dm-losedp').oninput = e => { mode.loseDuelPoints = parseInt(e.target.value) || 0; };
  document.getElementById('dm-wincp').oninput = e => { mode.winCardPoints = parseInt(e.target.value) || 0; };
  document.getElementById('dm-losecp').oninput = e => { mode.loseCardPoints = parseInt(e.target.value) || 0; };
  // 寿命奖励/惩罚
  const winDaysEl = document.getElementById('dm-windays');
  if (winDaysEl) winDaysEl.oninput = e => {
    const val = parseInt(e.target.value) || 0;
    if (val > 0) mode.winDays = val; else delete mode.winDays;
  };
  const loseDaysEl = document.getElementById('dm-losedays');
  if (loseDaysEl) loseDaysEl.oninput = e => {
    const val = parseInt(e.target.value) || 0;
    if (val > 0) mode.loseDays = val; else delete mode.loseDays;
  };
  const gameOverAgeEl = document.getElementById('dm-gameoverage');
  if (gameOverAgeEl) gameOverAgeEl.oninput = e => {
    const val = parseInt(e.target.value) || 0;
    if (val > 0) mode.gameOverAge = val; else delete mode.gameOverAge;
  };
  document.getElementById('dm-eventrate').oninput = e => { mode.battleEventBaseRate = parseFloat(e.target.value) || 0.3; };
  document.getElementById('dm-archetypebonus').oninput = e => { mode.archetypeEventBonus = parseFloat(e.target.value) || 0.15; };

  ['search','expand','disrupt','resist','suppress','power','soul','luck','proficiency','intelligence'].forEach(k => {
    const winEl = document.getElementById('dm-winstat-'+k);
    if (winEl) winEl.oninput = e => {
      if (!mode.winStats) mode.winStats = {};
      mode.winStats[k] = parseInt(e.target.value) || 0;
    };
    const loseEl = document.getElementById('dm-losestat-'+k);
    if (loseEl) loseEl.oninput = e => {
      if (!mode.loseStats) mode.loseStats = {};
      mode.loseStats[k] = parseInt(e.target.value) || 0;
    };
  });
}

// ===== 全局条件渲染和绑定函数（任务和比赛共用） =====
function renderConditions(conditions, prefix, conditionTypes) {
  const types = conditionTypes || TASK_CONDITION_TYPES;
  const OPERATORS = [
    {v:'>=', l:'大于等于 ≥'},
    {v:'<=', l:'小于等于 ≤'},
    {v:'>', l:'大于 >'},
    {v:'<', l:'小于 <'},
    {v:'==', l:'等于 ='},
    {v:'!=', l:'不等于 ≠'}
  ];
  return conditions.map((cond, i) => `
    <div class="condition-row" style="display:flex;gap:8px;align-items:flex-end;margin-bottom:8px;padding:10px;background:var(--bg-card);border-radius:6px;border:1px solid var(--border);flex-wrap:wrap;">
      <div class="form-group" style="flex:2;min-width:140px;">
        <label>条件${i+1}类型</label>
        <select class="${prefix}-cond-type" data-index="${i}">
          ${types.map(c=>`<option value="${c.v}" ${cond.type===c.v?'selected':''}>${c.l}</option>`).join('')}
        </select>
      </div>
      <div class="form-group" style="flex:1;min-width:80px;">
        <label>比较方式</label>
        <select class="${prefix}-cond-operator" data-index="${i}">
          ${OPERATORS.map(o=>`<option value="${o.v}" ${(cond.operator||'>=')===o.v?'selected':''}>${o.l}</option>`).join('')}
        </select>
      </div>
      <div class="form-group" style="flex:1.5;min-width:120px;">
        <label>目标ID/阈值</label>
        <input type="text" class="${prefix}-cond-target" data-index="${i}" value="${cond.target||cond.threshold||''}" placeholder="如 kame/yugi/m001/UR/50">
      </div>
      <div class="form-group" style="flex:1;min-width:70px;">
        <label>目标值</label>
        <input type="number" class="${prefix}-cond-value" data-index="${i}" value="${cond.value||1}" min="0">
      </div>
      <button class="btn btn-danger btn-sm ${prefix}-cond-remove" data-index="${i}" style="padding:6px 10px;white-space:nowrap;">删除</button>
    </div>
  `).join('');
}

function bindConditionEvents(prefix, conditionsArray, allowEmpty) {
  document.querySelectorAll(`.${prefix}-cond-type`).forEach(el => {
    el.onchange = e => {
      const idx = parseInt(e.target.dataset.index);
      conditionsArray[idx].type = e.target.value;
    };
  });
  document.querySelectorAll(`.${prefix}-cond-operator`).forEach(el => {
    el.onchange = e => {
      const idx = parseInt(e.target.dataset.index);
      conditionsArray[idx].operator = e.target.value;
    };
  });
  document.querySelectorAll(`.${prefix}-cond-target`).forEach(el => {
    el.oninput = e => {
      const idx = parseInt(e.target.dataset.index);
      conditionsArray[idx].target = e.target.value;
    };
  });
  document.querySelectorAll(`.${prefix}-cond-value`).forEach(el => {
    el.oninput = e => {
      const idx = parseInt(e.target.dataset.index);
      conditionsArray[idx].value = parseInt(e.target.value) || 0;
    };
  });
  document.querySelectorAll(`.${prefix}-cond-remove`).forEach(el => {
    el.onclick = e => {
      const idx = parseInt(e.target.dataset.index);
      if (!allowEmpty && conditionsArray.length <= 1) {
        showToast('至少保留一个条件');
        return;
      }
      conditionsArray.splice(idx, 1);
      renderEditor();
    };
  });
}

function bindTaskEvents(t) {
  document.getElementById('f-name').oninput = e => { t.name=e.target.value; renderListItems(); };
  document.getElementById('f-id').oninput = e => { t.id=e.target.value; renderListItems(); };
  document.getElementById('f-type').onchange = e => { t.type=e.target.value; renderEditor(); };
  document.getElementById('f-order').oninput = e => { t.order=parseInt(e.target.value)||1; };
  document.getElementById('f-desc').oninput = e => { t.desc=e.target.value; };
  document.getElementById('f-story').oninput = e => { t.story=e.target.value; };

  // 完成条件 - 动态绑定（使用全局函数）
  bindConditionEvents('main', t.conditions);

  // 条件逻辑类型
  const logicEl = document.getElementById('f-condition-logic');
  if (logicEl) {
    logicEl.onchange = e => { t.conditionLogic = e.target.value; };
  }

  // 添加条件按钮
  const addBtn = document.getElementById('add-condition-btn');
  if (addBtn) {
    addBtn.onclick = () => {
      t.conditions.push({ type: 'collect_cards', value: 10 });
      renderEditor();
    };
  }

  // 隐藏任务解锁条件
  if (t.type === 'hidden' && t.unlockConditions) {
    bindConditionEvents('unlock', t.unlockConditions);
    const addUnlockBtn = document.getElementById('add-unlock-condition-btn');
    if (addUnlockBtn) {
      addUnlockBtn.onclick = () => {
        t.unlockConditions.push({ type: 'complete_task', value: 1 });
        renderEditor();
      };
    }
  }

  // 奖励
  if (!t.reward) t.reward = {};
  document.getElementById('f-reward-dp').oninput = e => { t.reward.duelPoints=parseInt(e.target.value)||0; };
  document.getElementById('f-reward-cp').oninput = e => { t.reward.cardPoints=parseInt(e.target.value)||0; };
  document.getElementById('f-reward-cards').oninput = e => { t.reward.cards=e.target.value.split(',').map(s=>s.trim()).filter(Boolean); };
  document.getElementById('f-reward-title').oninput = e => { t.reward.title=e.target.value; };
  document.getElementById('f-reward-talent').oninput = e => { t.reward.talent=e.target.value; };
  document.getElementById('f-reward-achievement').onchange = e => {
    if (e.target.value) {
      t.reward.achievement = e.target.value;
    } else {
      delete t.reward.achievement;
    }
  };
  document.getElementById('f-reward-duelmode').onchange = e => {
    if (e.target.value) {
      t.reward.duelMode = e.target.value;
    } else {
      delete t.reward.duelMode;
    }
  };
  // 解锁卡盒系统
  const cardboxEl = document.getElementById('f-reward-cardbox');
  if (cardboxEl) cardboxEl.onchange = e => {
    if (e.target.checked) {
      t.reward.unlockCardBox = true;
    } else {
      delete t.reward.unlockCardBox;
    }
  };

  // 属性奖励
  document.querySelectorAll('.reward-stat-input').forEach(input => {
    input.oninput = e => {
      if (!t.reward.stats) t.reward.stats = {};
      t.reward.stats[e.target.dataset.stat] = parseInt(e.target.value)||0;
    };
  });

  // 精灵力和觉醒碎片奖励
  const spiritEl = document.getElementById('f-reward-spirit');
  if (spiritEl) spiritEl.oninput = e => {
    const val = parseInt(e.target.value) || 0;
    if (val > 0) t.reward.spiritPower = val; else delete t.reward.spiritPower;
  };
  const shardsEl = document.getElementById('f-reward-shards');
  if (shardsEl) shardsEl.oninput = e => {
    const val = parseInt(e.target.value) || 0;
    if (val > 0) t.reward.awakeningShards = val; else delete t.reward.awakeningShards;
  };
}

// 赠礼列表渲染
function renderGiftItem(g, i) {
  const ALL_STATS = [
    {v:'search', l:'检索'}, {v:'expand', l:'展开'}, {v:'disrupt', l:'干扰'},
    {v:'resist', l:'抗性'}, {v:'suppress', l:'压制'}, {v:'power', l:'强度'},
    {v:'soul', l:'魂度'}, {v:'luck', l:'掏度'}, {v:'proficiency', l:'熟练度'},
    {v:'intelligence', l:'情报力'}
  ];
  let paramsHtml = '';
  switch(g.type) {
    case 'card':
      paramsHtml = `<input type="text" placeholder="卡片ID" value="${g.cardId||''}" style="flex:1" oninput="updateGift(${i},'cardId',this.value)">`;
      break;
    case 'talent':
      paramsHtml = `<input type="text" placeholder="天赋ID" value="${g.talentId||''}" style="flex:1" oninput="updateGift(${i},'talentId',this.value)">`;
      break;
    case 'stats':
      paramsHtml = `<select oninput="updateGift(${i},'stat',this.value)">
        ${ALL_STATS.map(s=>`<option value="${s.v}" ${g.stat===s.v?'selected':''}>${s.l}</option>`).join('')}
      </select><input type="number" placeholder="数值" value="${g.amount||1}" style="width:60px" oninput="updateGift(${i},'amount',parseInt(this.value)||0)">`;
      break;
    case 'cardPoints':
    case 'duelPoints':
      paramsHtml = `<input type="number" placeholder="数量" value="${g.amount||0}" style="width:80px" oninput="updateGift(${i},'amount',parseInt(this.value)||0)">`;
      break;
  }
  return `<div class="dyn-item" style="flex-wrap:wrap;gap:6px;">
    <div style="display:flex;gap:6px;align-items:center;width:100%;">
      <span style="font-size:11px;color:var(--text2);">好感</span>
      <input type="number" placeholder="30" value="${g.unlockAffinity||30}" style="width:50px" oninput="updateGift(${i},'unlockAffinity',parseInt(this.value)||30)">
      <select onchange="updateGift(${i},'type',this.value)" style="width:90px">
        <option value="card" ${g.type==='card'?'selected':''}>卡片</option>
        <option value="talent" ${g.type==='talent'?'selected':''}>天赋</option>
        <option value="stats" ${g.type==='stats'?'selected':''}>属性</option>
        <option value="cardPoints" ${g.type==='cardPoints'?'selected':''}>卡点</option>
        <option value="duelPoints" ${g.type==='duelPoints'?'selected':''}>决斗点</option>
      </select>${paramsHtml}
      <div class="dyn-del" onclick="removeGift(${i})">×</div>
    </div>
    <input type="text" placeholder="赠礼描述（可选）" value="${g.desc||''}" style="width:100%;font-size:11px;" oninput="updateGift(${i},'desc',this.value)">
  </div>`;
}

function addGift() {
  const c = getItem();
  if (!c) return;
  if (!c.gifts) c.gifts = [];
  c.gifts.push({ unlockAffinity: 30, type: 'card' });
  renderEditor();
}

function removeGift(i) {
  const c = getItem();
  if (!c || !c.gifts) return;
  c.gifts.splice(i, 1);
  renderEditor();
}

function updateGift(i, field, value) {
  const c = getItem();
  if (!c || !c.gifts || !c.gifts[i]) return;
  const g = c.gifts[i];
  if (field === 'type') {
    g.type = value;
    if (value === 'stats') { g.stat = g.stat || 'power'; g.amount = g.amount || 1; }
    renderEditor();
  } else if (field === 'stat') {
    g.stat = value;
    if (!g.stats) g.stats = {};
    g.stats = { [value]: g.amount || 1 };
  } else {
    g[field] = value;
    if (g.type === 'stats' && g.stat) {
      g.stats = { [g.stat]: g.amount || 1 };
    }
  }
}

function bindEventEvents(e) {
  document.getElementById('f-name').oninput = ev => { e.name=ev.target.value; renderListItems(); };
  document.getElementById('f-id').oninput = ev => { e.id=ev.target.value; renderListItems(); };
  document.getElementById('f-prob').oninput = ev => { e.probability=parseFloat(ev.target.value); };
  document.getElementById('f-title').oninput = ev => { e.title=ev.target.value; };
  document.getElementById('f-text').oninput = ev => { e.text=ev.target.value; };
  document.getElementById('f-failtext').oninput = ev => { e.failText=ev.target.value; };
  document.getElementById('f-log').oninput = ev => { e.log=ev.target.value; };
  document.getElementById('f-cost').oninput = ev => {
    const v = parseInt(ev.target.value);
    if (v > 0) { if(!e.cost)e.cost={}; e.cost.duelPoints=v; } else { delete e.cost; }
  };
}

function updateEventField(field, value) {
  const e = getItem();
  if (!e) return;
  if (value === 0 || value === '') delete e[field];
  else e[field] = value;
}

// 效果操作
function addEffect() {
  const e = getItem();
  if (!e.effects) e.effects = [];
  e.effects.push({type:'text'});
  renderEditor();
}
function removeEffect(i, prefix) {
  const e = getItem();
  if (prefix) {
    const optIdx = parseInt(prefix.split('-')[1]);
    e.options[optIdx].effects.splice(i,1);
  } else {
    e.effects.splice(i,1);
  }
  renderEditor();
}
function updateEffect(i, field, value, prefix) {
  const e = getItem();
  if (prefix) {
    const optIdx = parseInt(prefix.split('-')[1]);
    e.options[optIdx].effects[i][field] = value;
  } else {
    e.effects[i][field] = value;
  }
  if (field === 'type') renderEditor();
}

// 选项操作
function addOption() {
  const e = getItem();
  if (!e.options) e.options = [];
  e.options.push({name:'新选项', effects:[{type:'text'}]});
  renderEditor();
}
function removeOption(i) {
  const e = getItem();
  e.options.splice(i,1);
  renderEditor();
}
function updateOption(i, field, value) {
  const e = getItem();
  e.options[i][field] = value;
}
function toggleOptionEffects(i) {
  const el = document.getElementById('option-effects-'+i);
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}
function addOptionEffect(i) {
  const e = getItem();
  if (!e.options[i].effects) e.options[i].effects = [];
  e.options[i].effects.push({type:'text'});
  renderEditor();
  document.getElementById('option-effects-'+i).style.display = 'block';
}

// ===== Toast =====
let toastTimer;
function showToast(msg) {
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.remove(), 2500);
}

renderSidebar();
// 尝试自动加载（http协议下）
if (window.location.protocol !== 'file:') {
  Promise.all([
    fetch('card-data.js').then(r=>r.text()).then(t=>{
      const m = t.match(/window\.CARD_DB\s*=\s*(\{[\s\S]*?\});/);
      if (m) cardDB = new Function('return '+m[1])();
    }).catch(()=>{}),
    fetch('game-data.js').then(r=>r.text()).then(t=>{
      try {
        const tm = t.match(/window\.TALENTS\s*=\s*(\[[\s\S]*?\]);/); if(tm)gameData.talents=new Function('return '+tm[1])();
        const lm = t.match(/window\.LOCATIONS\s*=\s*(\[[\s\S]*?\]);/); if(lm)gameData.locations=new Function('return '+lm[1])();
        const cm = t.match(/window\.CHARACTERS\s*=\s*(\[[\s\S]*?\]);/); if(cm)gameData.characters=new Function('return '+cm[1])();
        const tm2 = t.match(/window\.TOURNAMENTS\s*=\s*(\[[\s\S]*?\]);/); if(tm2)gameData.tournaments=new Function('return '+tm2[1])();
        const am = t.match(/window\.ACHIEVEMENTS\s*=\s*(\[[\s\S]*?\]);/); if(am)gameData.achievements=new Function('return '+am[1])();
        const em = t.match(/window\.EVENTS\s*=\s*(\{[\s\S]*?\});/); if(em)gameData.events=new Function('return '+em[1])();
        const rcm = t.match(/window\.REDEEM_CODES\s*=\s*(\[[\s\S]*?\]);/); if(rcm)gameData.redeemCodes=new Function('return '+rcm[1])();
      } catch(e){}
    }).catch(()=>{})
  ]).then(()=>{
    if (Object.keys(cardDB).length || gameData.talents.length) showToast('已自动加载数据文件');
  });
}

// 弹窗拖动功能
let cardBoxDragState = { isDragging: false, startX: 0, startY: 0, startLeft: 0, startTop: 0 };

function startCardBoxDrag(e) {
  if (e.target.tagName === 'BUTTON') return;
  const window = document.getElementById('cb-card-picker-window');
  if (!window) return;
  cardBoxDragState.isDragging = true;
  cardBoxDragState.startX = e.clientX;
  cardBoxDragState.startY = e.clientY;
  const rect = window.getBoundingClientRect();
  cardBoxDragState.startLeft = rect.left;
  cardBoxDragState.startTop = rect.top;
  window.style.transform = 'none';
  window.style.margin = '0';
  document.addEventListener('mousemove', onCardBoxDrag);
  document.addEventListener('mouseup', stopCardBoxDrag);
  e.preventDefault();
}

function onCardBoxDrag(e) {
  if (!cardBoxDragState.isDragging) return;
  const window = document.getElementById('cb-card-picker-window');
  if (!window) return;
  const dx = e.clientX - cardBoxDragState.startX;
  const dy = e.clientY - cardBoxDragState.startY;
  let newLeft = cardBoxDragState.startLeft + dx;
  let newTop = cardBoxDragState.startTop + dy;
  // 限制在视口范围内
  const maxLeft = window.innerWidth - window.offsetWidth;
  const maxTop = window.innerHeight - window.offsetHeight;
  newLeft = Math.max(0, Math.min(newLeft, maxLeft));
  newTop = Math.max(0, Math.min(newTop, maxTop));
  window.style.left = newLeft + 'px';
  window.style.top = newTop + 'px';
  window.style.right = 'auto';
  window.style.bottom = 'auto';
}

function stopCardBoxDrag() {
  cardBoxDragState.isDragging = false;
  document.removeEventListener('mousemove', onCardBoxDrag);
  document.removeEventListener('mouseup', stopCardBoxDrag);
}

  statRows.forEach(row => {
    const key = row.querySelector('.rc-stat-key').value;
    const val = parseInt(row.querySelector('.rc-stat-val').value) || 0;
    if (val > 0) stats[key] = val;
  });
  if (Object.keys(stats).length > 0) reward.stats = stats;
  
  r.reward = reward;
  currentId = r.id;
  renderList();
  showToast('兑换码已保存');
}
</script>
</body>
</html>
